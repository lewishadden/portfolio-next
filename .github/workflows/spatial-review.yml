name: Spatial review diagnostics

on:
  pull_request:

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Format and diagnose styles
        run: |
          npm run prettier:write
          npm run lint:fix
        continue-on-error: true
      - name: Diagnose styles independently
        if: always()
        run: npm run lint:stylelint:fix
        continue-on-error: true
      - name: Export formatting for local review
        if: always()
        run: |
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          const changed = execFileSync('git', ['diff', '--name-only', '-z']).toString().split('\0').filter(Boolean);
          const archive = changed.length ? execFileSync('tar', ['-czf', '-', ...changed], { maxBuffer: 10000000 }).toString('base64') : '';
          console.log('SPATIAL_EXPORT_BEGIN');
          for (let i = 0; i < archive.length; i += 4000) console.log(archive.slice(i, i + 4000));
          console.log('SPATIAL_EXPORT_END');
          JS
      - name: Typecheck
        if: always()
        run: npm run typecheck
      - name: Build
        if: always()
        run: npm run build
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Inspect rendered panels
        run: |
          cat > tests/e2e/spatial-visual.spec.ts <<'TS'
          import { test, expect, openHydrated } from './fixtures';
          test.use({ world: 'on', reducedMotion: 'reduce' });
          test('spatial inspection visual review', { tag: '@webgl' }, async ({ page }) => {
            const errors: string[] = [];
            page.on('pageerror', error => errors.push(error.message));
            await page.setViewportSize({ width: 1440, height: 1000 });
            await openHydrated(page, '/projects?inspect=project:sidenote');
            await page.waitForSelector('.world--ready', { state: 'attached', timeout: 120000 });
            await page.waitForSelector('html:not([data-boot])', { state: 'attached', timeout: 60000 });
            await expect(page.getByRole('dialog', { name: 'Sidenote', exact: true })).toBeVisible();
            await page.waitForTimeout(1500);
            for (const [name, width, height] of [['desktop', 1440, 1000], ['mobile', 390, 844]] as const) {
              await page.setViewportSize({ width, height });
              await page.waitForTimeout(500);
              const screenshot = (await page.screenshot()).toString('base64');
              console.log('SPATIAL_IMAGE_BEGIN ' + name);
              for (let i = 0; i < screenshot.length; i += 4000) console.log(screenshot.slice(i, i + 4000));
              console.log('SPATIAL_IMAGE_END');
            }
            expect(errors).toEqual([]);
          });
          TS
          npx playwright test tests/e2e/spatial-visual.spec.ts tests/e2e/inspection.spec.ts tests/e2e/dialog-input.spec.ts tests/e2e/skills.spec.ts --reporter=line
